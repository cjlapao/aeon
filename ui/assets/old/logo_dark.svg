<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Dark Presentation -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Neon Cyan-Indigo High-Contrast Flow -->
    <linearGradient id="aeonDarkFlow" x1="10%" y1="15%" x2="90%" y2="85%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>

    <!-- Subtle Inner Cyber Glow -->
    <filter id="cyberGlowDark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="centralSparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Container / Backing Panel -->
  <rect width="512" height="512" rx="112" fill="url(#darkBg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Ambient Halo behind Center Intersection -->
  <circle cx="256" cy="256" r="88" fill="url(#centralSparkGlow)"/>

  <!-- Infinite Track Bed -->
  <path d="M 256,256 C 298,318 344,352 400,352 C 456,352 492,308 492,256 C 492,204 456,160 400,160 C 344,160 298,194 256,256 C 214,318 168,352 112,352 C 56,352 20,308 20,256 C 20,204 56,160 112,160 C 168,160 214,194 256,256 Z"
        fill="none"
        stroke="#1E293B"
        stroke-width="44"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Active Neon Flow Stream with Glow -->
  <g filter="url(#cyberGlowDark)">
    <path d="M 256,256 C 298,318 344,352 400,352 C 456,352 492,308 492,256 C 492,204 456,160 400,160 C 344,160 298,194 256,256 C 214,318 168,352 112,352 C 56,352 20,308 20,256 C 20,204 56,160 112,160 C 168,160 214,194 256,256 Z"
          fill="none"
          stroke="url(#aeonDarkFlow)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Overlapping Mobius Cross Section -->
    <path d="M 216,196 C 238,230 274,282 296,316"
          fill="none"
          stroke="#38BDF8"
          stroke-width="36"
          stroke-linecap="round"/>
  </g>

  <!-- Autonomous Agent / Iteration Pulse Nodes -->
  <circle cx="112" cy="160" r="14" fill="#0B1324" stroke="#38BDF8" stroke-width="7"/>
  <circle cx="112" cy="160" r="5" fill="#38BDF8"/>

  <circle cx="400" cy="352" r="14" fill="#0B1324" stroke="#2DD4BF" stroke-width="7"/>
  <circle cx="400" cy="352" r="5" fill="#2DD4BF"/>

  <!-- Central Orchestration Kernel -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="18" fill="#0F172A" stroke="#E2E8F0" stroke-width="6"/>
    <path d="M 0,-8 L 6,-2 L 2,6 L -2,6 L -6,-2 Z" fill="#38BDF8"/>
  </g>
</svg>