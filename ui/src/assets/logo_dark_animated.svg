<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Aeon Two-Tone Dual Loop Brand Mark (Neon Cyan & Electric Magenta) - Dark Cyber Theme -->
  <defs>
    <linearGradient id="cyberBgSlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1324"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="cyberNeonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="cyberNeonMagenta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <filter id="neonCyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="cyberCenterBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#EC4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
  </defs>



  <!-- Base Recessed Track -->
  <path d="M 256,256 C 210,210 170,166 116,166 C 58,166 22,206 22,256 C 22,306 58,346 116,346 C 170,346 210,302 256,256 C 302,210 342,166 396,166 C 454,166 490,206 490,256 C 490,306 454,346 396,346 C 342,346 302,302 256,256 Z"
        fill="none" stroke="#172033" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing Neon Dual-Tone Ribbons (Clean Center Intersection) -->
  <g filter="url(#neonCyberGlow)">
    <!-- Cyan Stream (Left Lobe) -->
    <path d="M 256,256 C 210,302 170,346 116,346 C 58,346 22,306 22,256 C 22,206 58,166 116,166 C 170,166 210,210 256,256"
          fill="none" stroke="url(#cyberNeonCyan)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Magenta Stream (Right Lobe) -->
    <path d="M 256,256 C 302,210 342,166 396,166 C 454,166 490,206 490,256 C 490,306 454,346 396,346 C 342,346 302,302 256,256"
          fill="none" stroke="url(#cyberNeonMagenta)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Glowing Telemetry Checkpoint Nodes -->
  <circle cx="116" cy="166" r="15" fill="#0B1324" stroke="#38BDF8" stroke-width="6"/>
  <circle cx="116" cy="166" r="6" fill="#38BDF8"/>
  <circle cx="116" cy="346" r="15" fill="#0B1324" stroke="#22D3EE" stroke-width="6"/>
  <circle cx="116" cy="346" r="6" fill="#22D3EE"/>

  <circle cx="396" cy="166" r="15" fill="#0B1324" stroke="#EC4899" stroke-width="6"/>
  <circle cx="396" cy="166" r="6" fill="#EC4899"/>
  <circle cx="396" cy="346" r="15" fill="#0B1324" stroke="#F43F5E" stroke-width="6"/>
  <circle cx="396" cy="346" r="6" fill="#F43F5E"/>

  <!-- Center Kernel -->
  <circle cx="256" cy="256" r="19" fill="#0B1324" stroke="#E2E8F0" stroke-width="6"/>
  <circle cx="256" cy="256" r="7" fill="#38BDF8"/>

  <!-- Glowing orb: runs the infinite loop on a steady cadence (one lap every 3.7s; turns from the left lobe's colour to the right lobe's at the centre crossing). Pure SVG + CSS, so it also animates inside <img>. -->
  <defs>
    <path id="orbTrack" d="M 256,256 C 210,210 170,166 116,166 C 58,166 22,206 22,256 C 22,306 58,346 116,346 C 170,346 210,302 256,256 C 302,210 342,166 396,166 C 454,166 490,206 490,256 C 490,306 454,346 396,346 C 342,346 302,302 256,256 Z"/>
    <filter id="orbGlow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      .orb-pulse { transform-box: fill-box; transform-origin: center; animation: orbPulse 1.1s ease-in-out infinite; }
      @keyframes orbPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) { .orb { display: none; } }
    </style>
  </defs>
  <g class="orb-layer">
    <g class="orb" opacity="0">
      <animateMotion dur="3.7s" repeatCount="indefinite" begin="0.22s" calcMode="linear" keyTimes="0;0.2027;0.7973;1" keyPoints="0;0;1;1"><mpath href="#orbTrack" xlink:href="#orbTrack"/></animateMotion>
      <animate attributeName="opacity" dur="3.7s" repeatCount="indefinite" begin="0.22s" keyTimes="0;0.2027;0.28378;0.71622;0.7973;1" values="0;0;0.3;0.3;0;0"/>
      <g class="orb-pulse">
        <circle r="11.5" fill="#A5F3FC" filter="url(#orbGlow)"><animate attributeName="fill" dur="3.7s" repeatCount="indefinite" begin="0.22s" keyTimes="0;0.2027;0.46757;0.53243;0.7973;1" values="#A5F3FC;#A5F3FC;#A5F3FC;#FBCFE8;#FBCFE8;#A5F3FC"/></circle>
        <circle r="4.2" fill="#FFFFFF"/>
      </g>
    </g>
    <g class="orb" opacity="0">
      <animateMotion dur="3.7s" repeatCount="indefinite" begin="0.11s" calcMode="linear" keyTimes="0;0.2027;0.7973;1" keyPoints="0;0;1;1"><mpath href="#orbTrack" xlink:href="#orbTrack"/></animateMotion>
      <animate attributeName="opacity" dur="3.7s" repeatCount="indefinite" begin="0.11s" keyTimes="0;0.2027;0.28378;0.71622;0.7973;1" values="0;0;0.55;0.55;0;0"/>
      <g class="orb-pulse">
        <circle r="16.1" fill="#A5F3FC" filter="url(#orbGlow)"><animate attributeName="fill" dur="3.7s" repeatCount="indefinite" begin="0.11s" keyTimes="0;0.2027;0.46757;0.53243;0.7973;1" values="#A5F3FC;#A5F3FC;#A5F3FC;#FBCFE8;#FBCFE8;#A5F3FC"/></circle>
        <circle r="5.9" fill="#FFFFFF"/>
      </g>
    </g>
    <g class="orb" opacity="0">
      <animateMotion dur="3.7s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2027;0.7973;1" keyPoints="0;0;1;1"><mpath href="#orbTrack" xlink:href="#orbTrack"/></animateMotion>
      <animate attributeName="opacity" dur="3.7s" repeatCount="indefinite" keyTimes="0;0.2027;0.28378;0.71622;0.7973;1" values="0;0;1.0;1.0;0;0"/>
      <g class="orb-pulse">
        <circle r="23.0" fill="#A5F3FC" filter="url(#orbGlow)"><animate attributeName="fill" dur="3.7s" repeatCount="indefinite" keyTimes="0;0.2027;0.46757;0.53243;0.7973;1" values="#A5F3FC;#A5F3FC;#A5F3FC;#FBCFE8;#FBCFE8;#A5F3FC"/></circle>
        <circle r="8.5" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
</svg>
